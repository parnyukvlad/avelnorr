<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avel Norr link statistics</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #fff1f8, #f7eaff); color: #54264f; }
    main { width: min(680px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 5vw, 2.5rem); }
    p { margin: 0 0 24px; color: #8a5b82; }
    .grid { display: grid; gap: 12px; }
    .card { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border: 1px solid #f0cde7; border-radius: 18px; background: #ffffffc9; box-shadow: 0 8px 24px #b86da51a; }
    .label { font-weight: 700; }
    .slug { display: block; margin-top: 4px; font-size: .8rem; color: #a87aa0; }
    .value { min-width: 56px; text-align: right; font-size: 1.65rem; font-weight: 800; color: #d34b91; }
    .status { color: #a87aa0; font-size: .9rem; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Avel Norr link statistics</h1>
    <p>Tracked clicks for the links on <a href="https://avelnorr.pages.dev/">avelnorr.pages.dev</a>.</p>
    <section id="stats" class="grid" aria-live="polite"><div class="status">Loading…</div></section>
  </main>
  <script>
    const links = [
      ['1to1 Messages with me for free', 'telegram-1to1'],
      ['Instagram', 'instagram'],
      ['Threads', 'threads'],
      ['X', 'x'],
      ['Telegram channel', 'telegram-channel'],
    ];
    const namespace = 'avelnorr-link-in-bio';
    const stats = document.getElementById('stats');

    Promise.all(links.map(async ([label, key]) => {
      try {
        const response = await fetch(`https://counterapi.com/api/${namespace}/view/${encodeURIComponent(key)}?readOnly=true`);
        const data = await response.json();
        return [label, key, Number(data.value || 0)];
      } catch {
        return [label, key, null];
      }
    })).then(rows => {
      stats.replaceChildren(...rows.map(([label, key, value]) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div><span class="label"></span><span class="slug"></span></div><div class="value"></div>`;
        card.querySelector('.label').textContent = label;
        card.querySelector('.slug').textContent = `/go/${key}`;
        card.querySelector('.value').textContent = value === null ? '—' : value.toLocaleString();
        return card;
      }));
    });
  </script>
</body>
</html>
